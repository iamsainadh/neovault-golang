services:
  postgres:
    image: postgres:latest
    container_name: neovault-db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neo_vault"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: neo_vault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin

  # Api Gateway
  neovault-apigateway:
    image: "iamsainadh/neovault-apigateway:v1"
    container_name: api-gateway
    ports:
      - "8081:8081"
    healthchecks:
      # Add One more check http
      test: ["CMD", "grpc-health-probe", "-addr=localhost:50051"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    mem_limit: 700m
    networks:
      - neovault
    environment:
      PORT: 8081
      AUTH_PORT: 50052
      SECRET_PORT: 50053
      VAULT_PORT: 50054
      AUDIT_PORT: 50055

  # Auth Service
  neovault-auth:
    image: "iamsainadh/neovault-auth:v1"
    container_name: auth-services
    ports:
      - "50052:50052"
    healthcheck:
      test: ["CMD", "grpc-health-probe", "-addr=localhost:50052"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 700m
    networks:
      - neovault
    environment:
      DB_URI: "postgres://postgres:admin@postgres:5432/neo_vault?sslmode=disable"
      JWT_SECRET: # Your JWT Secret

  # Secret Service
  neovault-secret:
    image: "iamsainadh/neovault-secret:v1"
    container_name: secret-services
    ports:
      - "50053:50053"
    healthcheck:
      test: ["CMD", "grpc-health-probe", "-addr=localhost:50053"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 700m
    networks:
      - neovault
    environment:
      DB_URI: "postgres://postgres:admin@postgres:5432/neo_vault?sslmode=disable"

  # Vault Service
  neovault-vault:
    image: "iamsainadh/neovault-vault:v1"
    container_name: vault-services
    ports:
      - "50054:50054"
    healthcheck:
      test: ["CMD", "grpc-health-probe", "-addr=localhost:50054"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 700m
    networks:
      - neovault
    environment:
      DB_URI: "postgres://postgres:admin@postgres:5432/neo_vault?sslmode=disable"
      PORT: 50054
      RMK_KEY: # Add Your RMK Key

  neovault-scheduler:
    image: "iamsainadh/neovault-scheduler:v1"
    container_name: scheduler-service
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - neovault

  # Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

networks:
  neovault:
    driver: "bridge"
