syntax = "proto3";

package secret;

option go_package = "github.com/iamsainadh/neovault/services/secret/proto";

enum SecretVersionStatus{
  SECRET_VERSION_STATUS_ACTIVE     = 0;
  SECRET_VERSION_STATUS_DEPRECATED = 1;
  SECRET_VERSION_STATUS_DELETED    = 2;
}

service SecretVersion {
  rpc CreateSecretVersion(CreateSecretVersionRequest) returns (CreateSecretVersionResponse);
  rpc GetSecretVersionById(GetSecretVersionBySecretIdRequest) returns (GetSecretVersionBySecretIdResponse);
  rpc CreateRotatedSecretVersion(CreateRotatedSecretVersionRequest) returns (CreateRotatedSecretVersionRequest);
}

message CreateSecretVersionRequest{
  string              secret_id             = 1;
  int32               version               = 2;
  string              OrgId                 = 3;
  string              Value                 = 4;
  bytes               encrypted_payload     = 5;
  bytes               encrypted_dek         = 6;
  string              vault_key_id          = 7;
  SecretVersionStatus secret_version_status = 8;
  string              created_by            = 9;
}

message CreateSecretVersionResponse{
  string id         = 1;
  string secret_id  = 2;
  int32  version    = 3;
  string created_by = 4;
}

// ----- Get Secret Version BY Secret Id

message GetSecretVersionBySecretIdRequest{
  string secret_id = 1;
}

message GetSecretVersionBySecretIdResponse{
  string id                = 1;
  string secret_id         = 2;
  int32  version           = 3;
  bytes  encrypted_payload = 4;
  bytes  encrypted_dek     = 5;
  string vault_key_id      = 6;
}

// --- Create New And Update Old Rotate Secret Version
message CreateRotatedSecretVersionRequest{
  string secret_id         = 1;
  int32  version           = 2;
  bytes  encrypted_payload = 3;
  bytes  encrypted_dek     = 4;
  string vault_key_id      = 5;
  string created_by        = 6;
}


message CreateRotatedSecretVersionResponse{
  string id = 1;
}