syntax = "proto3";

package secrets;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/iamsainadh/neovault/services/secret/proto";

service SecretService {
  rpc CreateSecret(CreateSecretRequest) returns (CreateSecretResponse);
  rpc GetSecretByKey(GetSecretByKeyRequest) returns (GetSecretByKeyResponse);
  rpc GetAllSecretByOrg(GetAllSecretByOrgRequest) returns (GetAllSecretByOrgResponse);
  rpc DeleteSecretByOrgAndName(DeleteRequestByOrgAndNameRequest) returns (DeleteRequestByOrgAndNameResponse);
  rpc CheckSecretRotationRequired(CheckSecretRotationRequest) returns (CheckSecretRotationResponse);
  rpc UpdateSecretRotated(UpdateSecretRotatedRequest) returns (UpdateSecretRotatedResponse);
}

//**************************************************** Enums ****************************************/
enum SecretType {
  SECRET_TYPE_UNSPECIFIED = 0;
  SECRET_TYPE_GENERIC     = 1;
  SECRET_TYPE_API_KEY     = 2;
  SECRET_TYPE_PASSWORD    = 3;
  SECRET_TYPE_TOKEN       = 4;
}

enum SecretStatus {
  SECRET_STATUS_UNSPECIFIED = 0;
  SECRET_STATUS_ACTIVE      = 1;
  SECRET_STATUS_ARCHIVED    = 2;
  SECRET_STATUS_DELETED     = 3;
}

message Secret {
  string                    id                     = 1;
  string                    org_id                 = 2;
  string                    name                   = 3;
  SecretType                secret_type            = 4;
  int32                     current_version        = 5;
  bool                      is_rotation_enabled    = 6;
  int32                     rotation_interval_days = 7;
  SecretStatus              status                 = 8;
  google.protobuf.Timestamp last_rotated_at        = 9;
  google.protobuf.Timestamp created_at             = 10;
  google.protobuf.Timestamp updated_at             = 11;
  string                    created_by             = 12;
  string                    payload_format         = 13;

}

//************************************** Create Secret Request **************************************
message CreateSecretRequest{
  string        org_id                 = 1;
  string        name                   = 2;
  string        description            = 3;
  SecretPayload value                  = 4;
  SecretType    secret_type            = 5;
  bool          is_rotation_enabled    = 6;
  int32         rotation_interval_days = 7;
  string        created_by             = 8; // UUID of organization member
}

//************************************** Create Secret Response **************************************
message CreateSecretResponse {
  Secret secret = 1;
}

message SecretPayload {
  oneof value {
    string raw_value  = 1; // For API_KEY, TOKEN, PASSWORD
    string json_value = 2; // pre-marshaled JSON string, e.g. DB connection info
  }
}

//! Get Secret By Key
//************************************** Get Secret By Key Request **************************************
message GetSecretByKeyRequest{
  string org_id = 1;
  string key    = 2;
}

//************************************** Get Secret By Key Response **************************************
message GetSecretByKeyResponse{
  string key     = 1;
  string value   = 2;
  string version = 3;
}

//************************************** Get Secret By Rotation Request **************************************
message GetSecretByRotationRequest{
  string org_id = 1;
  string key    = 2;
}

//************************************** Get Secret By Rotation Response **************************************

//! List All Secret

message GetAllSecretByOrgRequest{
  string org_id = 1;
}

message GetAllSecretByOrgResponse{
  Secret secret = 1;
}

//! Delete Secret
message DeleteRequestByOrgAndNameRequest{
  string org_id = 1;
  string name   = 2;
}

message DeleteRequestByOrgAndNameResponse{
  string message = 1;
}

//! Rotate Secret

message CheckSecretRotationRequest {
  int32  limit  = 1;
  string org_id = 2;
}

message CheckSecretRotationResponse {
  repeated SecretRotationItem secrets = 1;
}

message SecretRotationItem {
  string id              = 1;
  string org_id          = 2;
  string name            = 3;
  int32  current_version = 4;
}

message UpdateSecretRotatedRequest{
  string                    secret_id       = 1;
  int32                     current_version = 2;
  google.protobuf.Timestamp last_rotated_at = 3;
}

message UpdateSecretRotatedResponse{
  bool updated = 1;
}