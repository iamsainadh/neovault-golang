# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-service-Deployment
  label: secret-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-service
  template:
    metadata:
      labels: secret-service
    spec:
      containers:
        - name: secret-service
          image: iamsainadh/neovault-secret:v1
          ports:
            - containerPort: 50053
          env:
            - name: GRPCPort
              valueFrom:
                configMapKeyRef:
                  name: neo_vault_config
                  key: SECRET_PORT
            - name: VAULT_PORT
              valueFrom:
                configMapKeyRef:
                  name: neo_vault_config
                  key: VAULT_PORT
            - name: DB_URI
              valueFrom:
                configMapKeyRef:
                  name: neo_vault_config
                  key: DB_URI
            - name:
              valueFrom:
                secretKeyRef:
                  name: neo_vault_secret
                  key: RMK_KEY
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: secret-service
spec:
  selector:
    app: secret-service
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 50053
      targetPort: 50053
